version: '3.8'

services:
  startfarm-backend:
    build:
      context: ./backend
      target: ${ENV:-prod}
    container_name: startfarm-backend
    networks:
      - dataverse
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${BACKEND_PORT:-4000}
      - API_BASE_URL=${API_BASE_URL:-/api/v1}
      - DB_HOST=${DB_HOST:-dev_postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - DB_NAME=${DB_NAME:-kms}
      - DB_SYNC=${DB_SYNC:-false}
      - DB_LOGGING=${DB_LOGGING:-true}
      - REDIS_URL=${REDIS_URL:-redis://kms_redis:6379}
      - DATAVERSE_BASE_URL=${DATAVERSE_BASE_URL:-http://dataverse:8080/api}
      - DATAVERSE_API_TOKEN=${DATAVERSE_API_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - kms_redis
      - dev_postgres
    restart: unless-stopped

  startfarm-frontend:
    build:
      context: ./frontend
      target: ${ENV:-prod}
    container_name: startfarm-frontend
    networks:
      - dataverse
    environment:
      - VITE_NODE_ENV=${VITE_NODE_ENV:-production}
      - VITE_API_URL=${VITE_API_URL:-http://localhost/api/v1}
      - VITE_DATAVERSE_URL=${VITE_DATAVERSE_URL:-http://localhost/dataverse}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - dataverse
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - startfarm-backend
      - startfarm-frontend
      - dev_dataverse
    restart: unless-stopped

  kms_redis:
    image: redis:7
    container_name: kms_redis
    networks:
      - dataverse
    volumes:
      - redis-data:/data
    restart: unless-stopped

networks:
  dataverse:
    external: true

volumes:
  redis-data: