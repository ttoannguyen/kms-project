services:
  startfarm-backend:
    build:
      context: ./backend
    container_name: startfarm-backend
    networks:
      - dataverse
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${BACKEND_PORT:-4000}
      - API_BASE_URL=${API_BASE_URL:-/api/v1}
      - DB_HOST=${DB_HOST:-postgres-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD:-admin}
      - DB_NAME=${DB_NAME:-postgres}
      - DB_SYNC=${DB_SYNC:-false}
      - DB_LOGGING=${DB_LOGGING:-true}
      - REDIS_URL=${REDIS_URL:-redis://kms_redis:6379}
      - DATAVERSE_BASE_URL=${DATAVERSE_BASE_URL:-http://dataverse:8080/api}
      - DATAVERSE_API_TOKEN=${DATAVERSE_API_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - postgres-db
      - kms_redis
    restart: unless-stopped

  startfarm-frontend:
    build:
      context: ./frontend
    container_name: startfarm-frontend
    networks:
      - dataverse
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx-proxy
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - dataverse
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - startfarm-backend
      - startfarm-frontend
      - dev_dataverse
    restart: unless-stopped

  postgres-db:
    image: postgres:16.2
    container_name: postgres-db
    environment:
      - POSTGRES_USER=${DB_USER:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-admin}
      - POSTGRES_DB=${DB_NAME:-postgres}
    ports:
      - "${DB_PORT:-10000}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - dataverse
    restart: unless-stopped

  kms_redis:
    image: redis:7.2
    container_name: kms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dataverse
    restart: unless-stopped

networks:
  dataverse:
    external: true

volumes:
  pgdata:
  redis-data: