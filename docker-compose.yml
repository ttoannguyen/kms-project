services:
  db:
    image: postgres:16.2
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.2
    container_name: redis-server
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: backend-server
    env_file:
      - ./backend/.env
    expose:
      - "3000" # expose nội bộ, không public
    depends_on:
      - db
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: frontend-app
    env_file:
      - ./frontend/.env
    expose:
      - "5173" # hoặc 80 nếu dùng nginx trong container
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:stable
    container_name: nginx-proxy
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  pgdata:
